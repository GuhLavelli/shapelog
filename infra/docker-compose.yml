name: shapelog

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shapelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shapelog_dev}
      POSTGRES_DB: ${POSTGRES_DB:-shapelog_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shapelog -d shapelog_development"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../apps/web:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-shapelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shapelog_dev}
      POSTGRES_DB: ${POSTGRES_DB:-shapelog_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-shapelog_test}
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      SEED_PASSWORD: ${SEED_PASSWORD:-changeme123}
    networks:
      - app_network
    command: bin/dev
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache:

networks:
  app_network:
    driver: bridge
